<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Înregistrare — PhotoPlanner</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; max-width: 420px; }
        label { display: block; margin-top: 14px; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
        .eroare { color: #c0392b; background: #fdecea; padding: 10px; margin-top: 16px; }
        .eroare-camp { color: #c0392b; font-size: 13px; margin: 4px 0 0; }
    </style>
    <link rel="stylesheet" th:href="@{/css/mobil.css}">
</head>
<body>
<h1>Creare cont</h1>

<div class="eroare" th:if="${eroare}" th:text="${eroare}"></div>

<form th:action="@{/inregistrare}" method="post" th:object="${inregistrareForm}">
    <label>Nume afișat
        <input type="text" th:field="*{numeAfisat}" required maxlength="100">
    </label>
    <p class="eroare-camp" th:if="${#fields.hasErrors('numeAfisat')}" th:errors="*{numeAfisat}"></p>

    <label>Email
        <input type="email" th:field="*{email}" required maxlength="150">
    </label>
    <p class="eroare-camp" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

    <!--
      Parola nu se re-completează la reafișarea formularului: th:field ar trimite-o înapoi
      în HTML, iar o parolă nu are ce căuta în pagina servită.
    -->
    <label>Parolă (minim 8 caractere)
        <input type="password" name="parola" required minlength="8" maxlength="72"
               autocomplete="new-password">
    </label>
    <p class="eroare-camp" th:if="${#fields.hasErrors('parola')}" th:errors="*{parola}"></p>

    <button type="submit">Creează cont</button>
</form>
</body>
</html>
