<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Butonul de delogare.

  Delogarea trebuie să fie POST, nu un simplu link: Spring Security nu ascultă decât pe
  POST /logout cât timp protecția CSRF e pornită. Un `<a href="/logout">` ajunge la 404 și
  lasă sesiunea deschisă — exact ce se întâmpla înainte, în toate cele șapte pagini.
  POST are și un rost dincolo de asta: un GET poate fi declanșat de o imagine de pe alt site,
  așa că cineva ar putea deloga utilizatorul fără voia lui.

  E ținut într-un fragment tocmai pentru că se repetă: greșeala de dinainte a fost copiată
  de șapte ori, iar corectarea ei ar fi trebuit făcută tot de șapte ori.

  Stilurile stau inline fiindcă fiecare pagină își are propriul bloc <style>, iar fragmentul
  trebuie să arate la fel în toate, fără să depindă de ce s-a definit în pagina gazdă.
  `min-height: auto` învinge regula pentru ecrane tactile din mobil.css, care altfel ar
  întinde butonul pe 44px și ar rupe rândul de navigare.
-->
<form th:fragment="buton" th:action="@{/logout}" method="post"
      style="display: inline; margin: 0;">
    <button type="submit"
            style="background: none; border: none; padding: 0; margin: 0; min-height: auto;
                   font: inherit; color: #2c3e50; text-decoration: underline; cursor: pointer;">
        Delogare
    </button>
</form>

</body>
</html>
