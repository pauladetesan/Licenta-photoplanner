<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorite — PhotoPlanner</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; max-width: 780px; }
        h1 { color: #2c3e50; }
        .antet { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; margin-top: 16px; }
        .card h2 { margin: 0 0 4px 0; font-size: 20px; }
        .card h2 a { color: inherit; text-decoration: none; }
        .card h2 a:hover { text-decoration: underline; }
        .meta { color: #666; font-size: 13px; }
        .teme span { display: inline-block; background: #eef2f7; color: #2c3e50; border-radius: 12px;
                     padding: 2px 10px; margin: 6px 4px 0 0; font-size: 12px; }
        .lumina { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
        .lumina div { background: #fafafa; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
        .lumina .titlu { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
        .goala { color: #888; margin-top: 20px; }
        .fus { font-size: 11px; color: #aaa; margin-top: 8px; }
        .link-buton { background: none; border: none; padding: 0; margin-top: 10px; font: inherit; font-size: 13px;
                      color: #c0392b; cursor: pointer; text-decoration: underline; }
        a { color: #2c3e50; }
        .coperta { float: right; width: 110px; height: 80px; object-fit: cover; border-radius: 6px;
                   border: 1px solid #eee; margin: 0 0 8px 14px; background: #f4f4f4; }
    </style>
    <link rel="stylesheet" th:href="@{/css/navigare.css}">
    <link rel="stylesheet" th:href="@{/css/mobil.css}">
</head>
<body>
<div class="antet">
    <h1>Favorite</h1>
    <th:block th:replace="~{fragmente/navigare :: bara('favorite')}"></th:block>
</div>

<p class="goala" th:if="${locatii.isEmpty()}">Nu ai adăugat nicio locație la favorite încă.</p>

<div class="card" th:each="intrare : ${locatii}">
    <a th:if="${coperti.containsKey(intrare.key.id)}" th:href="@{/locatii/{id}(id=${intrare.key.id})}">
        <img class="coperta" th:src="@{/poze/{p}/mica(p=${coperti.get(intrare.key.id)})}"
             loading="lazy" alt="Fotografie de la locație">
    </a>
    <h2><a th:href="@{/locatii/{id}(id=${intrare.key.id})}" th:text="${intrare.key.nume}">Nume locație</a></h2>
    <p class="meta">
        <span th:text="${intrare.key.autor.numeAfisat}">Autor</span> ·
        <span th:text="${#numbers.formatDecimal(intrare.key.latitudine,1,'NONE',3,'POINT')} + ', ' + ${#numbers.formatDecimal(intrare.key.longitudine,1,'NONE',3,'POINT')}">lat, lon</span>
    </p>
    <div class="teme" th:if="${!intrare.key.teme.isEmpty()}">
        <span th:each="tema : ${intrare.key.teme}" th:text="${tema}">TEMA</span>
    </div>

    <div class="lumina">
        <div>
            <div class="titlu">Răsărit</div>
            <div th:text="${#temporals.format(intrare.value.rasarit, 'HH:mm')}">--:--</div>
        </div>
        <div>
            <div class="titlu">Apus</div>
            <div th:text="${#temporals.format(intrare.value.apus, 'HH:mm')}">--:--</div>
        </div>
        <div>
            <div class="titlu">Oră de aur — dimineață</div>
            <div th:text="${#temporals.format(intrare.value.oraDeAurDimineataStart, 'HH:mm')} + ' – ' + ${#temporals.format(intrare.value.oraDeAurDimineataStop, 'HH:mm')}">--:-- – --:--</div>
        </div>
        <div>
            <div class="titlu">Oră de aur — seară</div>
            <div th:text="${#temporals.format(intrare.value.oraDeAurSearaStart, 'HH:mm')} + ' – ' + ${#temporals.format(intrare.value.oraDeAurSearaStop, 'HH:mm')}">--:-- – --:--</div>
        </div>
    </div>

    <p class="fus">Ore locale &middot; <span th:text="${intrare.key.fusOrar}">fus orar</span></p>

    <form th:action="@{/locatii/{id}/favorit(id=${intrare.key.id})}" method="post">
        <button type="submit" class="link-buton">Scoate din favorite</button>
    </form>
</div>
</body>
</html>
