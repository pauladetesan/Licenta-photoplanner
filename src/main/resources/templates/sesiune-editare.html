<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editează sesiunea — PhotoPlanner</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px auto; max-width: 520px; padding: 0 20px; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 4px; }
        .locatie { color: #666; margin-top: 0; font-size: 15px; }
        label { display: block; margin-top: 16px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px;
                                  box-sizing: border-box; font-family: inherit; font-size: 15px; }
        button { margin-top: 22px; padding: 10px 20px; cursor: pointer; font-size: 15px; }
        .indiciu { color: #888; font-size: 13px; margin-top: 6px; }
        a { color: #2c3e50; }
    </style>
    <link rel="stylesheet" th:href="@{/css/mobil.css}">
</head>
<body>
<h1>Editează sesiunea</h1>
<p class="locatie" th:text="${locatie.nume}">Locație</p>

<form th:action="@{/sesiuni/{id}/editare(id=${sesiune.id})}" method="post">

    <label>Ziua
        <input type="date" name="data" th:value="${sesiune.data}" required>
    </label>
    <label>Momentul zilei
        <select name="moment">
            <option th:each="m : ${momente}" th:value="${m}" th:text="${m.eticheta}"
                    th:selected="${m == sesiune.moment}"></option>
        </select>
    </label>
    <p class="indiciu">Ora exactă se calculează pentru locație și ziua aleasă.</p>
    <label>Notițe (opțional)
        <textarea name="notite" rows="4" maxlength="1000"
                  placeholder="ex. obiectiv 35mm, parcare lângă pod, verifică nivelul apei" th:text="${sesiune.notite}"></textarea>
    </label>
    <button type="submit">Salvează modificările</button>
</form>

<p style="margin-top:24px"><a th:href="@{/sesiuni}">← Înapoi</a></p>
</body>
</html>
