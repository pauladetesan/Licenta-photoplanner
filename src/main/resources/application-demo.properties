# Profilul „demo”: aplicația pornește pe o bază pregătită dinainte, cu conturi și locații de
# exemplu, ca cine o primește s-o poată vedea funcționând fără să introducă nimic.
#
#   ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=demo
#
# Baza de demonstrație e în ./demo și, spre deosebire de ./data, chiar intră în repository:
# e un instantaneu fix, mic, făcut ca să însoțească aplicația. Baza reală rămâne neatinsă —
# cele două profiluri nu se ating niciodată, fiindcă scriu în directoare diferite.
spring.datasource.url=jdbc:h2:file:./demo/photoplanner-demo
photoplanner.poze.director=./demo/poze

# La o demonstrație, SQL-ul din consolă e zgomot: cine se uită vrea să vadă aplicația,
# nu interogările Hibernate.
spring.jpa.show-sql=false

# Prognoza rămâne pornită: recomandarea „cel mai bun moment” arată cu totul altfel fără ea,
# iar cu date reale de la Open-Meteo demonstrația are sens.
photoplanner.vreme.activ=true
