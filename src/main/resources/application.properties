spring.application.name=PhotoPlanner
spring.datasource.url=jdbc:h2:file:./data/photoplanner;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.web.locale=ro
spring.web.locale-resolver=fixed
photoplanner.poze.director=./data/poze

# Prognoza meteo (Open-Meteo, fara cheie de acces). Poate fi oprita cu activ=false.
photoplanner.vreme.activ=true
photoplanner.vreme.url=https://api.open-meteo.com/v1/forecast

# Resetarea parolei.
# expeditor=log   -> linkul se scrie in log (implicit; doar pentru dezvoltare)
# expeditor=email -> se trimite prin SMTP, folosind spring.mail.* de mai jos
photoplanner.resetare.expeditor=log
#photoplanner.resetare.de-la=no-reply@exemplu.ro
#spring.mail.host=smtp.exemplu.ro
#spring.mail.port=587
#spring.mail.username=CONTUL_TAU
#spring.mail.password=PAROLA_DE_APLICATIE
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
photoplanner.resetare.minute=60
photoplanner.resetare.cereri-pe-ora=5
photoplanner.resetare.adresa-de-baza=http://localhost:8080

# Protectie impotriva ghicirii parolelor la autentificare.
photoplanner.login.esecuri-pe-cont=5
photoplanner.login.esecuri-pe-ip=20
photoplanner.login.minute-blocare=15

# Paginile de eroare nu arata detalii interne: un stack trace sau mesajul unei exceptii
# neasteptate ii spune unui atacator cum e construita aplicatia.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
