# Configurația folosită doar la teste.
#
# Aplicația rulează pe o bază H2 în fișier (./data/photoplanner). Dacă testele ar folosi-o și ele,
# ar da eroare cât timp aplicația e pornită, iar când ar reuși ar lucra direct pe datele reale.
# Testele primesc deci propria bază, în memorie, creată și ștearsă la fiecare rulare.
spring.datasource.url=jdbc:h2:mem:photoplanner-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Nici fotografiile din teste nu au ce căuta lângă cele reale.
photoplanner.poze.director=${java.io.tmpdir}/photoplanner-test-poze

# Testele nu trebuie sa iasa pe internet.
photoplanner.vreme.activ=false
